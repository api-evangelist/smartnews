name: SmartNews
description: >-
  SmartNews is a news-discovery company whose consumer app ranks and delivers
  news to tens of millions of readers in Japan and the United States. For
  developers it operates the SmartNews Ads platform and publishes the SmartNews
  Marketing API (v3) — a REST API for programmatically managing advertising
  campaigns, ad groups, ads, media files, custom audiences, conversion pixels,
  and Business Manager product catalogs, plus an Insights API for performance
  reporting. The API uses OAuth 2.0 bearer (JWT) access tokens and is documented
  with a public OpenAPI 3.0 reference and an official API-spec repository.
