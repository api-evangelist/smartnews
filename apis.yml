- aid: smartnews:smartnews-conversion-api
  name: SmartNews Ads Conversion API
  description: >-
    Server-to-server conversion event ingestion for SmartNews Ads. Advertisers
    POST self-attributed web and app conversions (35 event names including
    Purchase, AddToCart, Lead, Install and SignUp) to SmartNews for attribution
    and optimization, either singly or in batches of up to 1,000 events. Auth is
    a token in the Authorization header; a published staging host is available for
    testing before switching to production. Documented in the official SmartNews
    Ads API spec repository and the Ads Help Center — no OpenAPI is published for
    this surface.
  humanURL: https://help-ads.smartnews.com/en/item-5499/
  baseURL: https://log.smartnews-ads.com
  tags:
