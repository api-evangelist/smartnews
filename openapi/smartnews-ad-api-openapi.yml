    patch:
      tags:
      - ad
      description: 'Update an existing Ad by using the JSON Merge Patch specification, described in [RFC 7396](https://www.rfc-editor.org/rfc/rfc7396).\

        The API returns an business error when a request updates one or more of the following fields when the submission_status before this API call is SUBMITTED\

        - landing_page_url\

        - cta_label\

        - creative.headline\

        - creative.description\

        - creative.sponsored_name\

        - creative.media_file_ids

        '
      summary: Update an Ad
      operationId: patchAdById
      parameters:
      - name: Accept-Language
        in: header
        schema:
          $ref: '#/components/schemas/AcceptLanguage'
      - name: ad_account_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: ad_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/AdPatchRequest'
      responses:
        '200':
          description: A single ad object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdResponse'
        '400':
          description: Bad Request. The request body must be JSON format. This error response means the JSON body is malformed.
          content:
            application/json:
