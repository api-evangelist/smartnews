        properties:
          campaign_id:
            $ref: '#/components/schemas/CampaignID'
          ad_group_id:
            $ref: '#/components/schemas/AdGroupID'
          created_at:
            $ref: '#/components/schemas/AdGroupSchemas_CreatedAt'
          updated_at:
            $ref: '#/components/schemas/AdGroupSchemas_UpdatedAt'
          parent:
            $ref: '#/components/schemas/Parent'
          audience:
            $ref: '#/components/schemas/AudienceResponse'
          frequency_control:
            $ref: '#/components/schemas/FrequencyControl'
          delivery_status:
            $ref: '#/components/schemas/DeliveryStatusObject'
          has_any_video_ads:
            $ref: '#/components/schemas/HasAnyVideoAds'
          is_migrated_from_v1:
            $ref: '#/components/schemas/IsMigratedFromV1'
          dynamic_ads_config:
            $ref: '#/components/schemas/DynamicAdsConfigSchema'
