            - TOO_MANY_REQUESTS
    UnauthorizedErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/UnauthorizedError'
    HyperLocationSchemas_LocationId:
      type: integer
      description: 'The unique identifier of the location.


        A list of location IDs can be obtained via the [locations](#tag/locations) endpoint.

        '
      format: int32
    AdGroupSchemas_UpdatedAt:
      type: string
      format: date-time
      description: The date-time at which the ad group was last updated.
    ValidationError:
      type: object
      allOf:
      - $ref: '#/components/schemas/ValidationErrorExtension'
      - $ref: '#/components/schemas/ErrorBase'
    ConnectionTypes:
      description: An array of connection types to target.
      type: array
      items:
        $ref: '#/components/schemas/ConnectionType'
    Gender:
      type: string
      description: Selected genders of users for the ads to be delivered.
      enum:
      - MALE
      - FEMALE
      - UNKNOWN
    StoreSetId:
      type: integer
      format: int64
      description: 'Identifier of the store set associated with this campaign for Store Visit measurement.

        Store sets are managed under Business Management.

        '
    IncludeDeleted:
      type: boolean
      default: false
    HyperLocationConfigRequest:
      type: object
      nullable: true
      description: 'An object containing hyper location targeting configuration.


        Note: This field is not settable for US region ad accounts.

        '
      required:
      - user_segment
      - location_segments
      properties:
        user_segment:
          $ref: '#/components/schemas/UserSegment'
        location_segments:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LocationSegmentRequest'
          description: 'The list of location segments to target.


            The list must contain all the segments to target. If a segment is not included in the list, it will be removed from the targeting configuration in a PATCH request.


            Exactly one of `pin_with_radius_info` or `fixed_area_info` must be set based on the `segment_area_type` value.

            '
      example:
        user_segment: RESIDENT_AND_VISITOR
        location_segments:
        - segment_area_type: FIXED_AREA
          fixed_area_info:
            location_id: 70196
        - segment_area_type: FIXED_AREA
          fixed_area_info:
            location_id: 70150
        - segment_area_type: PIN_WITH_RADIUS
          pin_with_radius_info:
            address: 福島県伊達郡川俣町山木屋キトウスズ山２
            latitude: '37.59268044952155'
            longitude: '140.63639730916015'
            radius_in_meters: 3000
            label: My Label
    LocationSegmentFixedAreaInfo:
      type: object
      description: 'The configuration for the Fixed Area location segment. Required and only settable when `segment_area_type` is `FIXED_AREA`.

        '
      required:
      - location_id
      properties:
        location_id:
          $ref: '#/components/schemas/HyperLocationSchemas_LocationId'
    Page:
      type: integer
      minimum: 1
      default: 1
      example: 2
      description: 'The page of data to retrieve. The first page starts at 1, and each page will contain at most `page_size` items (the last page may contain less).


        To get the maximum available page number, refer to the `total_pages` field in the response''s `pagination` object.

        '
    Genders:
      description: 'An array of genders to target.


        Note: This field is not settable for US region ad accounts.

        '
      type: array
      items:
        $ref: '#/components/schemas/Gender'
    IsMigratedFromV1:
      type: boolean
      description: A boolean flag that indicates whether the object is migrated from v1.
    RateLimitedErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/RateLimitedError'
    BadRequestErrorExtension:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - BAD_REQUEST
    LocationSegmentId:
      type: integer
      description: 'The unique identifier of the location segment.


        If this property is set, the specified location segment will be updated (PATCH request only).


        If this property is not set, a new location segment will be created.


        This property is not allowed in POST requests.

        '
      format: int64
    PlacementMediaType:
      type: string
      enum:
      - SMART_VIEW
      - CHANNEL_VIEW
    RecencyDays:
      type: string
      nullable: true
      enum:
      - LAST_1_DAY
      - LAST_3_DAYS
      - LAST_7_DAYS
      - LAST_14_DAYS
      - LAST_30_DAYS
      - LAST_60_DAYS
      - LAST_90_DAYS
      description: 'The lookback window (in days) for user logs can be used for retargeting.


        - Required when targeting_type is `RETARGETING`

        - Set to null when targeting_type is `PROSPECTING`


        This value is updatable when the campaign is ready for delivery.

        '
    FrequencyControl:
      type: object
      nullable: true
      description: 'Frequency control settings for the ads to be delivered. Only available for Awareness campaign.


        Note: This field is not settable for US region ad accounts.

        '
      required:
      - interval
      - threshold
      properties:
        interval:
          $ref: '#/components/schemas/Interval'
        threshold:
          type: integer
          description: The maximum number of times the ad can be shown to a user within a given time period. Min 1, Max 15.
    ConfiguredStatus:
      type: string
      enum:
      - ACTIVE
      - PAUSED
      - DELETED
      description: The status of the object configured by an ad operator.
    LocationSegmentPinWithRadiusInfo:
      type: object
      description: 'The configuration for the Pin with Radius location segment. Required and only settable when `segment_area_type` is `PIN_WITH_RADIUS`.

        '
      required:
      - address
      - latitude
      - longitude
      - radius_in_meters
      properties:
        address:
          type: string
          description: 'The address of the location.

            '
        label:
          type: string
          description: 'The label of the location.

            '
        latitude:
          type: string
          description: 'The latitude of the location.

            '
        longitude:
          type: string
          description: 'The longitude of the location.

            '
        radius_in_meters:
          type: integer
          format: int32
          description: 'The radius in meters from the central point of the location.

            '
    AudienceRequest:
      type: object
      description: "In Patch Request, if you omit the property, the data will remain unchanged.\n\nIf you want to remove the current settings, set individual fields to either `null` or an empty array.\n\ne.g. This will remove the current settings of ages and genders, while keeping the locations and other audience fields unchanged:\n```\n{\n  ages: [],\n  genders: null,\n}\n```\n"
      properties:
        ages:
          $ref: '#/components/schemas/Ages'
        genders:
          $ref: '#/components/schemas/Genders'
        locations:
          $ref: '#/components/schemas/AdGroupLocations'
        zip_codes:
          $ref: '#/components/schemas/ZipCodes'
        hyper_location_config:
          $ref: '#/components/schemas/HyperLocationConfigRequest'
        operating_system:
          $ref: '#/components/schemas/OperatingSystem'
        custom_audiences:
          $ref: '#/components/schemas/CustomAudiences'
        connection_types:
          $ref: '#/components/schemas/ConnectionTypes'
        carrier_types:
          $ref: '#/components/schemas/CarrierTypes'
        interests:
          $ref: '#/components/schemas/Interests'
        media_types:
          $ref: '#/components/schemas/MediaTypes'
        channel_alias_labels:
          $ref: '#/components/schemas/ChannelAliasLabels'
        smart_view_article_category_targeting:
          $ref: '#/components/schemas/SmartViewArticleCategoryTargeting'
        smart_view_article_keyword_targeting:
          $ref: '#/components/schemas/SmartViewArticleKeywordTargeting'
        automated_targeting:
          $ref: '#/components/schemas/AutomatedTargeting'
    BusinessErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/BusinessError'
    ServiceUnavailableError:
      type: object
      allOf:
      - $ref: '#/components/schemas/ServiceUnavailableErrorExtension'
      - $ref: '#/components/schemas/ErrorBase'
    AdGroupLocations:
      description: 'An array of location IDs to target.


        A list of location IDs can be obtained via the [locations](#tag/locations) endpoint.


        Note: Only available for US accounts. For JP accounts, please use `hyper_location_config`.


        When both `locations` and `zip_codes` are provided, the delivery condition is satisfied if the user matches any of the given states/counties or any of the ZIP codes.

        '
      type: array
      items:
        $ref: '#/components/schemas/LocationId'
    LocationSegmentRequest:
      type: object
      required:
      - segment_area_type
      properties:
        location_segment_id:
          $ref: '#/components/schemas/LocationSegmentId'
        segment_area_type:
          $ref: '#/components/schemas/SegmentAreaType'
        pin_with_radius_info:
          $ref: '#/components/schemas/LocationSegmentPinWithRadiusInfo'
        fixed_area_info:
          $ref: '#/components/schemas/LocationSegmentFixedAreaInfo'
    DynamicAdsConfigPatchSchema:
      type: object
      description: 'The Configuration of the dynamic ads for PATCH requests.

        If campaign is for dynamic ads, this object is required.

        '
      properties:
        targeting_type:
          $ref: '#/components/schemas/TargetingType'
        recency_days:
          $ref: '#/components/schemas/RecencyDays'
    SmartViewArticleCategoryId:
      type: integer
      format: int32
