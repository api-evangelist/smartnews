- name: ad-group
paths:
  /api/ma/v3/ad_accounts/{ad_account_id}/campaigns/{campaign_id}/ad_groups:
    get:
      tags:
      - ad-group
      description: 'Get a paginated list of ad group objects under a specified campaign.


        This endpoint returns ad groups with pagination support, including pagination metadata in the response.

        '
      summary: List Ad Groups By Campaign (Paginated)
      operationId: getAdGroupsByCampaignPaginated
      parameters:
      - name: Accept-Language
        in: header
        schema:
          $ref: '#/components/schemas/AcceptLanguage'
        description: Controls the language of response text.
      - name: ad_account_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: campaign_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: include_deleted
        in: query
        required: false
        description: If `true`, deleted Ad Groups are included in the response.
        schema:
          $ref: '#/components/schemas/IncludeDeleted'
      - name: page_size
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PageSize'
      - name: page
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Page'
      responses:
        '200':
          description: A paginated list of ad group objects with pagination metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdGroupPaginatedResponse'
        '401':
          description: Unauthorized. The access token is either expired or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponse'
              x-examples:
                expiredToken:
                  summary: Access token has expired.
                  value:
                    error:
                      type: UNAUTHORIZED
                      message: Token has expired.
                      retriable: false
                invalidToken:
                  summary: Access token is invalid.
                  value:
                    error:
                      type: UNAUTHORIZED
                      message: Token is invalid.
                      retriable: false
        '403':
          description: Forbidden. Access to the requested resource is denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponse'
              examples:
                terms_of_service_not_accepted:
                  summary: User has not accepted the terms of service.
                  value:
                    error:
                      type: TERMS_OF_SERVICE_NOT_ACCEPTED
                      message: The owner of the assets must accept the Ads terms of service.
                      terms_of_service_path: /terms/agreement
                      retriable: false
                access_denied:
                  summary: Access is denied due to insufficient permissions.
                  value:
                    error:
                      type: ACCESS_DENIED
                      message: Access denied.
                      retriable: false
        '404':
          description: The user doesn't have permission to access the resource or the upper-level item doesn't exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundErrorResponse'
        '429':
          description: Too many requests were made within a short period. Wait a while and try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorResponse'
        '500':
          description: Unexpected error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnexpectedErrorResponse'
        '503':
          description: The service is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableErrorResponse'
