      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - TERMS_OF_SERVICE_NOT_ACCEPTED
          - ACCESS_DENIED
        terms_of_service_path:
          type: string
          example: /terms/agreement
          description: The path that the user must open in a browser to accept the terms of service. The hostname matches the API hostname.
    DeliveryStatusObject:
      type: object
      required:
      - status
      - reason
      - description
      properties:
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        reason:
          $ref: '#/components/schemas/DeliveryStatusReason'
        description:
          type: string
          description: A localized human readable description of the reason. The language is controlled by the Accept-Language header in the request.
      description: An Object that provides information about the delivery status of the campaign.
    ServiceUnavailableErrorExtension:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - UNDER_MAINTENANCE
    AdGroupRequest:
      type: object
      required:
      - name
      - configured_status
      properties:
        name:
          $ref: '#/components/schemas/AdGroupSchemas_Name'
        audience:
          $ref: '#/components/schemas/AudienceRequest'
        frequency_control:
          $ref: '#/components/schemas/FrequencyControl'
        configured_status:
          $ref: '#/components/schemas/ConfiguredStatus'
        dynamic_ads_config:
          $ref: '#/components/schemas/DynamicAdsConfigSchema'
    CarrierTypes:
      description: 'An array of mobile network carriers to target.


        Note: This field is not settable for US region ad accounts.

        '
      type: array
      items:
        $ref: '#/components/schemas/CarrierType'
    ChannelAliasLabels:
      description: 'An array of target channels to display the ads in the SmartNews app. If it is `null` or `[]`, all channels will be targeted.


        This value can only be set when `media_type` contains `CHANNEL_VIEW`.


        Note: This field is not settable for US region ad accounts.


        In PATCH request, if you set this field to `null` or `[]`, it will change the setting to target all channels. If you omit this field, it will retain the current setting.


        To get the list of available channel identifiers and their names, use the `GET /api/cm/v1/channel_alias_labels` endpoint.

        '
      type: array
      items:
        $ref: '#/components/schemas/ChannelAliasLabel'
    BusinessErrorExtension:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - BUSINESS_ERROR
    LocationSegmentResponse:
      type: object
      description: 'The response of the hyper location segment resource.


        Only one of `location_segment_pin_with_radius_info` or `location_segment_fixed_area_info` will be returned based on the segment_area_type value.

        '
      required:
      - location_segment_id
      - segment_area_type
      properties:
        location_segment_id:
          $ref: '#/components/schemas/LocationSegmentId'
        segment_area_type:
          $ref: '#/components/schemas/SegmentAreaType'
        pin_with_radius_info:
          $ref: '#/components/schemas/LocationSegmentPinWithRadiusInfo'
        fixed_area_info:
          $ref: '#/components/schemas/LocationSegmentFixedAreaInfo'
    PaginationInfoResponse:
      description: 'An object describing pagination parameters for this response.

        '
      type: object
      required:
      - page
      - page_size
      - total_pages
      - total_objects
      properties:
        page:
          type: integer
          description: The current page, where the first page starts at 1, and the last page corresponds to `total_pages`.
          example: 1
        page_size:
          type: integer
          description: 'The page size as specified in the request (note: the actual number of items in the response may be less if this is the last page of data.)'
          example: 100
        total_pages:
          type: integer
          description: The total number of pages for this query.
          example: 10
        total_objects:
          type: integer
          description: The total number of objects that exist across all pages.
          example: 987
    BadRequestError:
      type: object
      allOf:
      - $ref: '#/components/schemas/BadRequestErrorExtension'
      - $ref: '#/components/schemas/ErrorBase'
    SegmentAreaType:
      type: string
      description: 'The area type of the segment.

        '
      enum:
      - PIN_WITH_RADIUS
      - FIXED_AREA
    UnexpectedError:
      type: object
      allOf:
      - $ref: '#/components/schemas/UnexpectedErrorExtension'
      - $ref: '#/components/schemas/ErrorBase'
    Ages:
      description: 'An array of age buckets to target.


        Note:

        - This field is not settable for US region ad accounts.

        - `AGE_UNDER_20` option is deprecated and can no longer be used for new ad groups and when updating an existing ad group.

        '
      type: array
      items:
        $ref: '#/components/schemas/Age'
    UserSegment:
      type: string
      description: 'The type of users to target.

        '
      enum:
      - RESIDENT_ONLY
      - RESIDENT_AND_VISITOR
    ZipCodes:
      description: "An array of ZIP codes to target.\n\nThe values are combined with `locations` (states and counties) using OR logic during delivery.\n\nThe response returns ZIP codes in ascending numeric order while keeping their 5-digit string form.\n\n- Submit an empty array `[]` or `null` in a PATCH request to remove all ZIP codes.\n- Duplicate values in the request payload are ignored; the response returns a unique set of ZIP codes.\n- Supports up to 40,000 ZIP codes per request.\n\n* e.g. This targets Washington state, Pierce County, and ZIP codes `12345` / `67890`:\n  ```\n  {\n    ...\n    \"audience\": {\n      \"locations\": [2, 3],\n      \"zip_codes\": [\"12345\", \"67890\"]\n    }\n  }\n  ```\n"
      type: array
      items:
        $ref: '#/components/schemas/ZipCode'
      maxItems: 1000
      example:
      - '10001'
      - '10002'
    CustomAudiences:
      type: object
      description: "Custom audiences to include or exclude for ad delivery.\n\nIt contains the custom audience IDs to include or exclude for ad delivery.\n\nIf it's empty, it will be delivered to all users.\n\n* e.g. This will target all users\n  ```\n  {\n    ...\n    \"custom_audiences\": {\n      \"include\": [],\n      \"exclude\": []\n    }\n  }\n  ```\n* e.g. This will target users who are in custom audience `123`\n  ```\n  {\n    \"custom_audiences\": {\n        \"include\": [123],\n        \"exclude\": []\n      }\n  }\n  ```\n"
      properties:
        include:
          type: array
          description: An array of `custom_audience_id` to include for delivery.
          items:
            type: integer
            format: int64
        exclude:
          type: array
          description: An array of `custom_audience_id` to exclude for delivery.
          items:
            type: integer
            format: int64
    OperatingSystem:
      type: object
      nullable: true
      description: Target OS and optionally a specific OS version. If it is not specified, all OS and OS versions are targeted.
      required:
      - type
      properties:
        type:
          type: string
          description: 'The OS to target.

            '
          enum:
          - IOS
          - ANDROID
        since_version:
          type: string
          description: 'Selected OS version of users for the ads to be delivered.

            Ex: `13.0.0` means iOS 13.0.0 or later. Empty mean all version.

            '
    CarrierType:
      type: string
      enum:
      - DOCOMO
      - AU
      - SOFTBANK
      - ATNT
      - VERIZON
      - TMOBILE
      - BOOST
      - SPRINT
      - USCELLULAR
      - XFINITY
      - RAKUTEN
      - OTHERS
      - UNKNOWN
    IABInterestId:
      type: integer
      format: int32
    ForbiddenError:
      type: object
      allOf:
      - $ref: '#/components/schemas/ForbiddenErrorExtension'
      - $ref: '#/components/schemas/ErrorBase'
    ResourceNotFoundErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ResourceNotFoundError'
    UnauthorizedErrorExtension:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - UNAUTHORIZED
    ResourceNotFoundErrorExtension:
      type: object
      required:
      - type
      - resource_type
      properties:
        type:
          type: string
          enum:
          - NOT_FOUND
          - DELETED
        resource_type:
          type: string
          enum:
          - CAMPAIGN
          - AD_GROUP
          - AD
          - MEDIA_FILE
          - AD_ACCOUNT
          - PIXEL
          - CUSTOM_AUDIENCE
          - PIXEL_URL_CONFIGURATION
          - AM_CONFIGURATION
          - CATALOG
          - STORE_SET
          - RULE
    ErrorBase:
      type: object
      required:
      - message
      - retriable
      properties:
        message:
          type: string
        retriable:
          type: boolean
    ResourceNotFoundError:
      type: object
      allOf:
      - $ref: '#/components/schemas/ResourceNotFoundErrorExtension'
      - $ref: '#/components/schemas/ErrorBase'
    AdGroupSchemas_CreatedAt:
      type: string
      format: date-time
      description: The date-time at which the ad group was created.
    AdGroupPaginatedResponse:
      type: object
      required:
      - data
      - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdGroupResponse'
        pagination:
          $ref: '#/components/schemas/PaginationInfoResponse'
    ReadyForDelivery:
      type: boolean
      description: 'A boolean flag that indicates whether a ready for delivery. The flag is immutable once it turned to `true`.

        When the flag is true, the following fields are not updatable anymore.

        1. `start_date_time`

        2. `billing_event`

        3. `optimization_goal`

        4. `optimization_event`

        5. `website_tracking_tag`

        6. `viewability_measurement`

        7. `app_promotion_info` (PatchAppPromotionInfo)

        '
    AudienceResponse:
      type: object
      required:
      - ages
      - genders
      - custom_audiences
      - locations
      properties:
        ages:
          $ref: '#/components/schemas/Ages'
        genders:
          $ref: '#/components/schemas/Genders'
        locations:
          $ref: '#/components/schemas/AdGroupLocations'
        zip_codes:
          $ref: '#/components/schemas/ZipCodes'
        hyper_location_config:
          $ref: '#/components/schemas/HyperLocationConfigResponse'
        custom_audiences:
          $ref: '#/components/schemas/CustomAudiences'
        operating_system:
          $ref: '#/components/schemas/OperatingSystem'
        connection_types:
          $ref: '#/components/schemas/ConnectionTypes'
        carrier_types:
          $ref: '#/components/schemas/CarrierTypes'
        interests:
          $ref: '#/components/schemas/Interests'
        media_types:
          $ref: '#/components/schemas/MediaTypes'
        channel_alias_labels:
          $ref: '#/components/schemas/ChannelAliasLabels'
        smart_view_article_category_targeting:
          $ref: '#/components/schemas/SmartViewArticleCategoryTargeting'
        smart_view_article_keyword_targeting:
          $ref: '#/components/schemas/SmartViewArticleKeywordTargeting'
        automated_targeting:
          $ref: '#/components/schemas/AutomatedTargeting'
    Age:
      type: string
      enum:
      - AGE_UNDER_20
      - AGE_21_24
      - AGE_25_29
      - AGE_30_34
      - AGE_35_39
      - AGE_40_44
      - AGE_45_49
      - AGE_50_54
      - AGE_55_59
      - AGE_60_64
      - AGE_65_69
      - AGE_OVER_70
  requestBodies:
    post-requestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdGroupRequest'
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
