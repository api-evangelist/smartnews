                      type: TERMS_OF_SERVICE_NOT_ACCEPTED
                      message: The owner of the assets must accept the Ads terms of service.
                      terms_of_service_path: /terms/agreement
                      retriable: false
                access_denied:
                  summary: Access is denied due to insufficient permissions.
                  value:
                    error:
                      type: ACCESS_DENIED
                      message: Access denied.
                      retriable: false
        '404':
          description: When the resource specified in the path is not found or the user doesn't have permission to access the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundErrorResponse'
        '409':
          description: Business Error. The request is formatted correctly but doesn't pass business rule validations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessErrorResponse'
        '429':
          description: Too many requests were made within a short period. Wait a while and try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErrorResponse'
        '500':
          description: Unexpected error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnexpectedErrorResponse'
  /api/ma/v3/ad_accounts/{ad_account_id}/custom_audiences/{custom_audience_id}/ad_groups:
    get:
      tags:
      - ad-group
      summary: Get ad groups by custom audience.
      description: Get an array of adgroups that use the specified custom audience for targeting.
      operationId: getAdGroupsByCustomAudience
      parameters:
      - name: Accept-Language
        in: header
        schema:
          $ref: '#/components/schemas/AcceptLanguage'
      - name: ad_account_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: custom_audience_id
        in: path
        required: true
        description: The ID of the custom audience to retrieve ad groups for.
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: An array of ad group objects that use the specified custom audience for targeting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdGroupArrayResponse'
        '401':
          description: Unauthorized. The access token is either expired or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponse'
              x-examples:
                expiredToken:
                  summary: Access token has expired.
                  value:
                    error:
                      type: UNAUTHORIZED
                      message: Token has expired.
                      retriable: false
                invalidToken:
                  summary: Access token is invalid.
                  value:
                    error:
                      type: UNAUTHORIZED
                      message: Token is invalid.
                      retriable: false
        '403':
          description: Forbidden. Access to the requested resource is denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponse'
              examples:
                terms_of_service_not_accepted:
                  summary: User has not accepted the terms of service.
                  value:
                    error:
                      type: TERMS_OF_SERVICE_NOT_ACCEPTED
                      message: The owner of the assets must accept the Ads terms of service.
                      terms_of_service_path: /terms/agreement
                      retriable: false
                access_denied:
                  summary: Access is denied due to insufficient permissions.
                  value:
                    error:
                      type: ACCESS_DENIED
                      message: Access denied.
                      retriable: false
        '404':
          description: When the resource specified in the query is not found or the user doesn't have permission to access the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundErrorResponse'
        '500':
          description: Unexpected error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnexpectedErrorResponse'
        '503':
          description: The service is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableErrorResponse'
components:
  schemas:
    TargetingType:
      type: string
      description: "The type of DA targeting. \n\nRetargeting is for finding existing user; \nProspecting is for finding new user based on existing user log.\n\nThis value is NOT updatable once the campaign is ready for delivery.\n"
      enum:
      - RETARGETING
      - PROSPECTING
    AdGroupID:
      type: integer
      format: int64
      description: The ID of the ad group.
    AdGroupArrayResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdGroupResponse'
    DeliveryStatus:
      type: string
      enum:
      - DELETED
      - PAUSED
      - NOT_ELIGIBLE
      - PENDING
      - ENDED
      - ELIGIBLE
      - UNKNOWN
      - DISABLED
      description: 'The delivery status of the object determined by the system.


        | Delivery status | What it means |

        |-----------------|---------------|

        | DELETED         | The object is deleted by an ad operator |

        | PAUSED          | The object is paused by an ad operator  |

        | NOT_ELIGIBLE    | The object is configured to be active but is not delivered due to some conditions. Please check the `reason` or `description` field for more details |

        | PENDING         | The object is configured to be active and will be delivered when certain conditions are met. Please check Please check the `reason` or `description` field for more details |

        | ENDED           | The object is configured to be active but the campaign has ended |

        | ELIGIBLE        | The object is configured to be active and is delivering ads |

        | UNKNOWN         | The object is configured to be active but its delivery status is unknown |

        | DISABLED        | The object is disabled because the business, account, or brand is disabled|

        '
    PageSize:
      type: integer
      minimum: 1
      maximum: 1000
      default: 1000
      example: 100
      description: 'The number of objects to return per page.


        The maximum page size is 1000 and the default is 1000.

        '
    ZipCode:
      type: string
      pattern: ^\d{5}$
      description: 'A ZIP code used for ad group location targeting in the United States.


        - Accepts exactly five numeric digits. Leading zeroes must be included where applicable.

        - Only available for ad accounts in the US region.

        - Only valid ZIP codes are accepted.

        '
      example: '10001'
    AdGroupPatchRequest:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/AdGroupSchemas_Name'
        configured_status:
          $ref: '#/components/schemas/ConfiguredStatus'
        frequency_control:
          $ref: '#/components/schemas/FrequencyControl'
        audience:
          $ref: '#/components/schemas/AudienceRequest'
        dynamic_ads_config:
          $ref: '#/components/schemas/DynamicAdsConfigPatchSchema'
    HyperLocationConfigResponse:
      type: object
      nullable: true
      description: 'An object containing hyper location targeting configuration.

        '
      required:
      - user_segment
      - location_segments
      properties:
        user_segment:
          $ref: '#/components/schemas/UserSegment'
        location_segments:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LocationSegmentResponse'
          description: 'The list of location segments being targeted.

            '
    OptimizationEvent:
      type: string
      enum:
      - PURCHASE
      - ADD_TO_CART
      - INITIATE_CHECKOUT
      - SUBMIT_FORM
      - SUBSCRIBE
      - COMPLETE_REGISTRATION
      - CONTACT
      - SIGN_UP
      - VIEW_CONTENT
      - ADD_PAYMENT_INFO
      - ADD_TO_WISH_LIST
      - VISIT_CART
      - CUSTOMIZE_PRODUCT
      - SEARCH
      - BOOKING
      - DOWNLOAD
      - START_TRIAL
      - SHARE
      - LOGIN
      - DONATE
      - FIND_LOCATION
      - TIME_SPENT
      - LEAD
      - INSTALL
      - D1_RETENTION
      nullable: true
      description: "Optimization event defines which conversion event the campaign is optimized for.\n\n| Optimization Goal         | Available optimization events |\n|---------------------------|-------------------------------|\n| VIEWABLE_IMPRESSIONS      | n/a |\n| CLICK                     | n/a |\n| OFFSITE_CONVERSIONS       | PURCHASE, ADD_TO_CART, COMPLETE_REGISTRATION, VIEW_CONTENT, SUBSCRIBE, CONTACT, SIGN_UP, ADD_PAYMENT_INFO, ADD_TO_WISH_LIST, VISIT_CART, CUSTOMIZE_PRODUCT, SEARCH, BOOKING, DOWNLOAD, START_TRIAL, SHARE, LOGIN, DONATE, FIND_LOCATION, TIME_SPENT, INITIATE_CHECKOUT, SUBMIT_FORM |\n| ROAS (Dynamic Ads only)   | ADD_TO_CART, VIEW_CONTENT, PURCHASE, LEAD |\n| INSTALL                   | INSTALL |\n| INSTALL_WITH_IN_APP_EVENT | D1_RETENTION, PURCHASE, ADD_TO_CART, INITIATE_CHECKOUT, SUBMIT_FORM, SUBSCRIBE, COMPLETE_REGISTRATION, CONTACT, SIGN_UP, VIEW_CONTENT |\n\nNote:\n1. This field is not updatable when `ready_for_delivery` is `true`.\n2. `LEAD` event is only available for dynamic ads campaigns.\n3. For dynamic ads campaigns, only the following optimization events are supported:\n  - `ADD_TO_CART`\n  - `VIEW_CONTENT`\n  - `PURCHASE`\n  - `LEAD`\n"
    DynamicAdsConfigSchema:
      type: object
      required:
      - targeting_type
      description: 'The Configuration of the dynamic ads.

        If campaign is for dynamic ads, this object is required.

        '
      properties:
        targeting_type:
          $ref: '#/components/schemas/TargetingType'
        recency_days:
          $ref: '#/components/schemas/RecencyDays'
        product_set_id:
          $ref: '#/components/schemas/ProductSetID'
    SmartViewArticleCategoryTargeting:
      type: object
      nullable: true
      required:
      - include
      - exclude
      description: 'SmartView article category targeting settings for ad delivery.


        It contains article category IDs to include or exclude for delivery.


        This field is only configurable when `media_types` includes `SMART_VIEW`.


        include `[]` means all article categories are included


        exclude `[]` means no article categories are excluded


        A category ID cannot appear in both the include and exclude lists.


        Some example settings:

        | **Case** | **Include**        | **Exclude** | **Behavior**                                                      |

        |----------|--------------------|-------------|-------------------------------------------------------------------|

        | 1        | `[]` (include All) | `[]`        | Deliver to all article categories (Also the default value for UI) |

        | 2        | `[]` (include All) | `[1, 3, 5]` | Deliver to all categories except `1, 3, 5`                        |

        | 3        | `[1, 2, 3]`        | `[]`        | Deliver to only categories `1, 2, 3`                              |

        | 4        | `[1, 2]`           | `[3, 5]`    | Deliver only to categories `1, 2` excluding `3, 5`                |

        | 5        | `[1, 2, 3]`        | `[1, 5]`    | ❌ Validation error - category `1` appears in both lists          |


        A list of article category IDs can be obtained via the [article categories](#tag/article-category) endpoint.

        '
      properties:
        include:
          description: An array of article category IDs to include for delivery.
          type: array
          nullable: false
          items:
            $ref: '#/components/schemas/SmartViewArticleCategoryId'
        exclude:
          description: An array of article category IDs to exclude for delivery.
          type: array
          nullable: false
          items:
            $ref: '#/components/schemas/SmartViewArticleCategoryId'
    Parent:
      type: object
      required:
      - id
      - type
      - name
      properties:
        id:
          type: integer
          format: int64
          description: The ID of the parent object.
        type:
          type: string
          enum:
          - CAMPAIGN
          - AD_GROUP
        name:
          type: string
          description: The name of the object.
        objective:
          $ref: '#/components/schemas/CampaignObjective'
        optimization_event:
          $ref: '#/components/schemas/OptimizationEvent'
        ready_for_delivery:
          $ref: '#/components/schemas/ReadyForDelivery'
        store_set_id:
          $ref: '#/components/schemas/StoreSetId'
        parent:
          type: object
          description: 'The parent of the parent. The properties are the same as parent (`id`, `name`, `type`, `objective`,

            `optimization_event` ,`ready_for_delivery` ,`store_set_id` ,`parent`)

            '
    ForbiddenErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ForbiddenError'
    UnauthorizedError:
      type: object
      allOf:
      - $ref: '#/components/schemas/UnauthorizedErrorExtension'
      - $ref: '#/components/schemas/ErrorBase'
    MediaTypes:
      description: 'An array of media types defining where the ads will be displayed in the SmartNews app.


        Note: This field is not settable for US region ad accounts.

        '
      type: array
      items:
        $ref: '#/components/schemas/PlacementMediaType'
    CampaignID:
      type: integer
      format: int64
      description: The ID of the campaign.
    UnexpectedErrorExtension:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - UNEXPECTED_ERROR
    BadRequestErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/BadRequestError'
    SmartViewArticleKeywordTargeting:
      type: object
      nullable: true
      required:
      - include
      - exclude
      description: 'SmartView article keyword targeting settings for ad delivery.


        Ads will be delivered to SmartView ad placements of articles which include and/or exclude these keywords or a similar topic.


        This field is only configurable when `media_types` includes `SMART_VIEW`.


        include `[]` means deliver to articles containing any keyword


        exclude `[]` means no articles are excluded by keyword


        A keyword cannot appear in both the include and exclude lists.


        Only system available keywords are allowed. To get the list of available keywords, use the `POST /api/ma/v3/article_keywords/search` endpoint.


        Duplicate values in the request payload are ignored; the response returns a unique set of keywords.


        Some example settings:

        | **Case** | **Include**                          | **Exclude**                | **Behavior**                                                                                        |

        |----------|--------------------------------------|----------------------------|-----------------------------------------------------------------------------------------------------|

        | 1        | `[]` (include All)                   | `[]`                       | Deliver to articles containing any keyword (Also the default value for UI)                          |

        | 2        | `[]` (include All)                   | `["soccer", "baseball"]`   | Deliver to all articles except those containing `"soccer"` or `"baseball"`                          |

        | 3        | `["restaurant", "tokyo", "travel"]`  | `[]`                       | Deliver only to articles containing `"restaurant"`, `"tokyo"`, or `"travel"`                        |

        | 4        | `["restaurant", "tokyo"]`            | `["soccer", "baseball"]`   | Deliver to articles containing `"restaurant"` or `"tokyo"`, excluding those containing `"soccer"` or `"baseball"` |

        | 5        | `["restaurant", "tokyo", "soccer"]`  | `["soccer", "baseball"]`   | ❌ Validation error - keyword `"soccer"` appears in both lists                                     |

        '
      properties:
        include:
          description: An array of keywords. Ads will be delivered to articles containing these keywords.
          type: array
          nullable: false
          items:
            type: string
        exclude:
          description: An array of keywords. Articles containing these keywords will be excluded from delivery.
          type: array
          nullable: false
          items:
            type: string
    ServiceUnavailableErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ServiceUnavailableError'
    ValidationErrorExtension:
      required:
      - type
      - error_fields
      properties:
        type:
          type: string
          enum:
          - VALIDATION_ERROR
        error_fields:
          type: array
          items:
            type: object
            properties:
              field_name:
                type: string
                description: "The field name that doesn't pass the validation.\\\nFor nested fields, the field name will be in the format of JSON path with dot notation.\\\nHere are some examples:\\\n  - `landing_page_url`(a root level field)\\\n  - `ad.creative.headline`(a nested object field)\\\n  - `creative.image_creative_info.media_file_ids`(an array in a nested object)\\\n  - `creative.carousel_creative_info.carousel_cards[0].caption`(a field of an object in an array)\\\n"
              reason:
                type: string
    CampaignObjective:
      type: string
      enum:
      - TRAFFIC
      - SALES
      - AWARENESS
      - APP_PROMOTION
      description: 'The objective of the campaign. It defines the business goal that customers pursue during a campaign.\


        Note: Only `TRAFFIC` and `SALES` objectives are usable for US region ad account.

        '
    BusinessError:
      type: object
      allOf:
      - $ref: '#/components/schemas/BusinessErrorExtension'
      - $ref: '#/components/schemas/ErrorBase'
    Interests:
      description: 'An array of IAB Interest IDs to target.


        A list of IAB Interest IDs can be obtained via the [iab_interest_categories](#tag/interests) endpoint.


        Note: This field is not settable for US region ad accounts.

        '
      type: array
      items:
        $ref: '#/components/schemas/IABInterestId'
    UnexpectedErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/UnexpectedError'
    ValidationErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ValidationError'
    AutomatedTargeting:
      type: object
      nullable: true
      description: 'Automated targeting settings for the ads to be delivered with SN optimized strategy.


        If this field is non-null, automated targeting is enabled (even if the object is empty). Otherwise, it is disabled.


        Note: This field is not settable for US region ad accounts.

        '
      properties:
        age_unbreakable:
          type: boolean
          default: false
          description: If this field is `true`, then age targeting will be strictly followed
        gender_unbreakable:
          type: boolean
          default: false
          description: If this field is `true`, then gender targeting will be strictly followed
        location_unbreakable:
          type: boolean
          default: false
          description: If this field is `true`, then location targeting will be strictly followed
        custom_audience_unbreakable:
          type: boolean
          default: false
          description: If this field is `true`, then custom audience will be strictly followed
        carrier_unbreakable:
          type: boolean
          default: false
          description: If this field is `true`, then carrier targeting will be strictly followed
        connection_type_unbreakable:
          type: boolean
          default: false
          description: If this field is `true`, then connection type targeting will be strictly followed
        os_version_unbreakable:
          type: boolean
          default: false
          description: If this field is `true`, then advertiser's os version targeting will be strictly followed
    AcceptLanguage:
      type: string
      description: 'The language to use for system generated text within API responses.


        The currently supported languages are English (`en`, `en-*`) and Japanese (`ja`, `ja-JP`)

        '
      example: en-US
    LocationId:
      type: integer
      format: int32
    HasAnyVideoAds:
      type: boolean
      description: Whether the ad object has any video ads, including those that have been deleted.
    ConnectionType:
      type: string
      nullable: true
      enum:
      - WIFI
      - CELLULAR_5G
      - CELLULAR_4G
      - CELLULAR_3G
    AdGroupSchemas_Name:
      type: string
      minLength: 1
      maxLength: 256
      description: 'The name of the ad group.


        Note: The maximum length is calculated by our standard length calculation rules: [See details](https://help-ads.smartnews.com/item-3888/)

        '
    ProductSetID:
      type: integer
      format: int64
      description: The ID of the product set.
    DeliveryStatusReason:
      type: string
      enum:
      - CAMPAIGN_DELETED
      - CAMPAIGN_PAUSED
      - NO_AD_GROUPS
      - ALL_AD_GROUPS_PAUSED_OR_DELETED
      - NO_ADS
      - NO_SUBMITTED_ADS
      - ALL_ADS_PAUSED_DELETED_OR_REJECTED
      - NO_APPROVED_ADS
      - CAMPAIGN_STARTS_IN_FUTURE
      - CAMPAIGN_ENDED
      - CAMPAIGN_OUTSIDE_DAILY_SCHEDULE
      - NO_ACTIVE_APPROVED_ADS
      - CAMPAIGN_ELIGIBLE
      - AD_GROUP_DELETED
      - AD_GROUP_PAUSED
      - AD_GROUP_ELIGIBLE
      - AD_DELETED
      - AD_NOT_SUBMITTED
      - AD_NOT_REVIEWED
      - AD_REJECTED
      - AD_PAUSED
      - AD_ELIGIBLE
      - CAMPAIGN_EXCEEDED_LIFETIME_SPENDING_LIMIT
      - UNCONFIRMED
      - BUSINESS_DISABLED
      - AD_ACCOUNT_OR_BRAND_DISABLED
      - BUSINESS_AND_AD_ACCOUNT_UNDER_REVIEW
      - BUSINESS_NOT_APPROVED
      - AD_ACCOUNT_NOT_APPROVED
      - PAYMENT_METHOD_NOT_VERIFIED
      - PAYMENT_METHOD_ISSUE
      - PRODUCT_SET_NOT_READY
      - STORE_SET_NOT_READY
      description: 'An enum field for the reason the delivery status was determined.

        | Reason                                    | Layers    |

        |-------------------------------------------|-----------|

        | CAMPAIGN_DELETED                          | Campaign  |

        | CAMPAIGN_PAUSED                           | Campaign, Ad group, Ad |

        | NO_AD_GROUPS                              | Campaign  |

        | ALL_AD_GROUPS_PAUSED_OR_DELETED           | Campaign  |

        | NO_ADS                                    | Campaign, Ad group |

        | NO_SUBMITTED_ADS                          | Campaign, Ad group |

        | ALL_ADS_PAUSED_DELETED_OR_REJECTED        | Campaign, Ad group |

        | NO_APPROVED_ADS                           | Campaign, Ad group |

        | CAMPAIGN_STARTS_IN_FUTURE                 | Campaign, Ad group, Ad |

        | CAMPAIGN_ENDED                            | Campaign, Ad group, Ad |

        | CAMPAIGN_OUTSIDE_DAILY_SCHEDULE           | Campaign |

        | NO_ACTIVE_APPROVED_ADS                    | Campaign, Ad group |

        | CAMPAIGN_ELIGIBLE                         | Campaign  |

        | AD_GROUP_DELETED                          | Ad group  |

        | AD_GROUP_PAUSED                           | Ad group, Ad  |

        | AD_GROUP_ELIGIBLE                         | Ad group  |

        | AD_DELETED                                | Ad        |

        | AD_NOT_SUBMITTED                          | Ad        |

        | AD_NOT_REVIEWED                           | Ad        |

        | AD_REJECTED                               | Ad        |

        | AD_PAUSED                                 | Ad        |

        | AD_ELIGIBLE                               | Ad        |

        | CAMPAIGN_EXCEEDED_LIFETIME_SPENDING_LIMIT | Campaign, Ad group, Ad|

        | UNCONFIRMED                               | Campaign, Ad group, Ad|

        | BUSINESS_DISABLED                         | Campaign, Ad group, Ad |

        | AD_ACCOUNT_OR_BRAND_DISABLED              | Campaign, Ad group, Ad |

        | BUSINESS_AND_AD_ACCOUNT_UNDER_REVIEW      | Campaign, Ad group, Ad |

        | BUSINESS_NOT_APPROVED                     | Campaign, Ad group, Ad |

        | AD_ACCOUNT_NOT_APPROVED                   | Campaign, Ad group, Ad |

        | PAYMENT_METHOD_NOT_VERIFIED               | Campaign, Ad group, Ad |

        | PAYMENT_METHOD_ISSUE                      | Campaign, Ad group, Ad |

        | PRODUCT_SET_NOT_READY                     | Campaign, Ad group, Ad |

        | STORE_SET_NOT_READY                       | Campaign, Ad group, Ad |

        '
    Interval:
      type: string
      description: The time interval which frequency will be calculated.
      enum:
      - LAST_1_DAY
      - LAST_7_DAYS
    AdGroupResponse:
      allOf:
      - $ref: '#/components/schemas/AdGroupRequest'
      - type: object
        required:
        - ad_group_id
        - campaign_id
        - created_at
        - updated_at
