          type: string
          enum:
          - USER
          - BUSINESS
          - AD_ACCOUNT
          - DEVELOPER_APP
          - ENDPOINT
          - USER_AD_ACCOUNT_ACCESS
          - TERMS_OF_SERVICE
          - BRAND
          - CREDIT_CARD_PAYMENT_METHOD
          - AD_ACCOUNT_PAYMENT_THRESHOLD
          - MONTHLY_RECEIPT
          - AD_ACCOUNT_OUTSTANDING_BALANCE
          - AD_CREDIT_ACCOUNT
          - CATALOG
          - PRODUCT_SET
          - STORE_SET
    ForbiddenError:
