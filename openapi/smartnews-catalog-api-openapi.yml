        business_id:
          type: integer
          format: int64
          description: Identifier of the business that owns this catalog.
        name:
          type: string
          description: Human-readable display name for the catalog.
        currency:
          type: string
          description: Currency for the catalog.
        description:
          type: string
          description: Optional description of the catalog.
        review_status:
          $ref: '#/components/schemas/ReviewStatus'
        total_item_count:
          type: integer
          format: int32
          minimum: 0
          description: Total number of product items currently available in the catalog.
        all_ad_account_access:
          type: boolean
          description: Whether all DA ad accounts of the business have access to this catalog.
        pixel_tag_id:
          type: string
          description: Pixel tag ID associated with this catalog for web tracking.
        app_tracking:
          $ref: '#/components/schemas/AppTracking'
        ad_accounts:
          type: array
          items:
            $ref: '#/components/schemas/CatalogAdAccount'
          description: List of ad accounts that can access this catalog.
        product_sources:
          type: array
          items:
            $ref: '#/components/schemas/ProductSource'
          description: List of product sources that populate the catalog with product data.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the catalog was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the catalog metadata or configuration was last updated.
      description: Response for catalog creation containing the newly created catalog details.
    RuleMatchType:
      type: string
      enum:
      - ALL
      - AT_LEAST_ONE
      description: 'Rule matching strategy within a product set.

        - ALL: Products must satisfy every rule (logical AND).

        - AT_LEAST_ONE: Products may satisfy any single rule (logical OR).

        '
    FilterCondition:
      type: string
      enum:
      - IS
      - IS_NOT
      - CONTAINS
      - NOT_CONTAINS
      - GREATER_THAN
      - LESS_THAN
      - GREATER_THAN_OR_EQUAL
      - LESS_THAN_OR_EQUAL
      - IS_ANY_OF_THE_FOLLOWINGS
      - IS_NOT_ANY_OF_THE_FOLLOWINGS
      description: Supported operators for catalog product filtering rules.
    CreateCatalogRequest:
      type: object
      required:
