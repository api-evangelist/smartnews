      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
          description: Human-readable display name for the product set.
        rule_match_type:
          $ref: '#/components/schemas/RuleMatchType'
        filter_rules:
          type: array
          items:
            $ref: '#/components/schemas/FilterRuleRequest'
          maxItems: 2
          minItems: 1
          description: 'Collection of filter rules to apply. Each field can have 1 or up to 2 rules.

            '
      description: Request body for creating a new product set.
    CommonSchemas_ValidationErrorExtension:
      required:
      - type
      - error_fields
      properties:
        type:
          type: string
          enum:
          - VALIDATION_ERROR
        error_fields:
          type: array
          items:
            type: object
            properties:
              field_name:
                type: string
                description: 'The field name that doesn''t pass the validation.

                  '
              reason:
                type: string
    BadRequestError:
      type: object
      allOf:
      - $ref: '#/components/schemas/BadRequestErrorExtension'
      - $ref: '#/components/schemas/ErrorBase'
    ServiceUnavailableErrorExtension:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - UNDER_MAINTENANCE
    ProductSourceStatus:
      type: string
      enum:
      - CREATED
      - SUCCESS
      - WARNING
      - ERROR
      description: "Status of the product source, covering both the latest fetch (connection)\nand the health of the items it imported. On a successful fetch the status\nreflects the item import breakdown; WARNING is derived on the backend so the\nthreshold stays configurable (BMT-1190). out_of_stock items are NOT counted\nas excluded for the WARNING calculation.\n- CREATED: Product source has been created and is awaiting a successful fetch\n- SUCCESS: Last fetch completed successfully and at most 20% of input items\n  were excluded (unparsable + blocked)\n- WARNING: Last fetch completed successfully but more than 20% of input items\n  were excluded (unparsable + blocked). The threshold is backend-configurable.\n- ERROR: Last fetch failed with errors\n"
    RuleMatchType:
      type: string
      enum:
      - ALL
      - AT_LEAST_ONE
      description: 'Rule matching strategy within a product set.

        - ALL: Products must satisfy every rule (logical AND).

        - AT_LEAST_ONE: Products may satisfy any single rule (logical OR).

        '
    ServiceUnavailableError:
      type: object
      allOf:
      - $ref: '#/components/schemas/ServiceUnavailableErrorExtension'
      - $ref: '#/components/schemas/ErrorBase'
    ForbiddenErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ForbiddenError'
    PatchProductSetRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
          description: Human-readable display name for the product set.
        rule_match_type:
          $ref: '#/components/schemas/RuleMatchType'
        filter_rules:
          type: array
          items:
            $ref: '#/components/schemas/FilterRuleRequest'
          description: 'Collection of filter rules to apply. Each field can have 1 or up to 2 rules.

            '
      description: Request body for updating an existing product set. At least one field must be provided.
    ProductSourceRequest:
      type: object
      required:
      - product_source_name
      - file_type
      - file_url
      properties:
        product_source_name:
          type: string
          minLength: 1
          maxLength: 256
          description: Name of the product source.
        file_type:
          $ref: '#/components/schemas/CommonSchemas_FileType'
        file_url:
          type: string
          minLength: 1
          maxLength: 1024
          description: FTP, HTTP, or HTTPS URL to the feed file.
        username:
          type: string
          minLength: 1
          maxLength: 256
          description: Optional username for feed file access.
        password:
          type: string
          minLength: 1
          maxLength: 256
          description: Optional password for feed file access.
      description: Product source configuration for catalog creation.
    FilterRule:
      type: object
      required:
      - filter_rule_id
      - field
      - condition
      - values
      properties:
        filter_rule_id:
          type: integer
          format: int64
          description: Unique identifier of the filter rule.
        field:
          $ref: '#/components/schemas/FilterField'
        condition:
          $ref: '#/components/schemas/FilterCondition'
        values:
          type: array
          items:
            type: string
          maxItems: 10
          description: 'Array of values used by the condition. Maximum 10 values allowed for IS_ANY_OF_THE_FOLLOWINGS and IS_NOT_ANY_OF_THE_FOLLOWINGS conditions.

            '
      description: Filter rule definition used to build a product set.
    BadRequestErrorExtension:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - BAD_REQUEST
    FilterCondition:
      type: string
      enum:
      - IS
      - IS_NOT
      - CONTAINS
      - NOT_CONTAINS
      - GREATER_THAN
      - LESS_THAN
      - GREATER_THAN_OR_EQUAL
      - LESS_THAN_OR_EQUAL
      - IS_ANY_OF_THE_FOLLOWINGS
      - IS_NOT_ANY_OF_THE_FOLLOWINGS
      description: Supported operators for catalog product filtering rules.
    UnauthorizedErrorResponse:
