      description: 'The reason for an ingestion error. Null when product source status is not ERROR.

        - AUTH_FAILED: Authentication failed (HTTP 401/403, FTP 530)

        - FILE_NOT_FOUND: File does not exist at the specified path (HTTP 404, FTP 550)

        - TIMEOUT: Server unreachable or timed out (HTTP 504, DNS failure)

