          enum:
          - TERMS_OF_SERVICE_NOT_ACCEPTED
          - ACCESS_DENIED
        terms_of_service_path:
          type: string
          example: /terms/agreement
          description: The path that the user must open in a browser to accept the terms of service. The hostname matches the API hostname.
    UpdateCatalogRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: Human-readable display name for the catalog.
        da_ad_account_ids:
          type: array
          items:
            type: integer
            format: int64
          description: 'Ad account access is addition-only. This list carries only the newly

            added dynamic ad account IDs to associate with the catalog; they are

            merged with the existing associations. Existing associations cannot be

            removed. Ignored when all_ad_account_access is true.

            '
        all_ad_account_access:
          type: boolean
          description: 'Set to true to grant all DA ad accounts of the business access to this

            catalog. Once enabled it cannot be reverted to specific ad accounts;

            a request attempting to set it back to false is rejected with 400.

            '
        pixel_tag_id:
          type: string
          maxLength: 64
          description: 'Pixel tag ID to associate with this catalog for web tracking. Can be

            changed regardless of campaign delivery status.

            '
        app_tracking:
          $ref: '#/components/schemas/AppTracking'
      description: 'Request body for updating catalog metadata. Only catalog-level fields are

        editable; region, currency, and timezone are read-only. At least one field

        must be provided.

        '
    CommonSchemas_ResourceNotFoundError:
      type: object
      allOf:
      - $ref: '#/components/schemas/CommonSchemas_ResourceNotFoundErrorExtension'
      - $ref: '#/components/schemas/ErrorBase'
