components:
  schemas:
    ProductSourceRequest:
      type: object
      required:
      - product_source_name
      - file_type
      - file_url
      properties:
        product_source_name:
          type: string
          minLength: 1
          maxLength: 256
          description: Name of the product source.
        file_type:
          $ref: '#/components/schemas/CommonSchemas_FileType'
        file_url:
          type: string
          minLength: 1
          maxLength: 1024
          description: FTP, HTTP, or HTTPS URL to the feed file.
        username:
          type: string
          minLength: 1
          maxLength: 256
          description: Optional username for feed file access.
        password:
          type: string
          minLength: 1
          maxLength: 256
          description: Optional password for feed file access.
      description: Product source configuration for catalog creation.
    CommonSchemas_ValidationErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/CommonSchemas_ValidationError'
    CatalogArrayResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CatalogResponse'
          description: Array of catalog objects returned by the list operation.
      description: Response wrapper containing a list of catalogs for a given business.
    PostProductSetRequest:
      type: object
      required:
      - name
      - rule_match_type
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
          description: Human-readable display name for the product set.
        rule_match_type:
          $ref: '#/components/schemas/RuleMatchType'
        filter_rules:
          type: array
          items:
            $ref: '#/components/schemas/FilterRuleRequest'
          maxItems: 2
          minItems: 1
          description: 'Collection of filter rules to apply. Each field can have 1 or up to 2 rules.

            '
      description: Request body for creating a new product set.
    ProductSourceStatus:
      type: string
      enum:
      - CREATED
      - SUCCESS
      - WARNING
      - ERROR
      description: "Status of the product source, covering both the latest fetch (connection)\nand the health of the items it imported. On a successful fetch the status\nreflects the item import breakdown; WARNING is derived on the backend so the\nthreshold stays configurable (BMT-1190). out_of_stock items are NOT counted\nas excluded for the WARNING calculation.\n- CREATED: Product source has been created and is awaiting a successful fetch\n- SUCCESS: Last fetch completed successfully and at most 20% of input items\n  were excluded (unparsable + blocked)\n- WARNING: Last fetch completed successfully but more than 20% of input items\n  were excluded (unparsable + blocked). The threshold is backend-configurable.\n- ERROR: Last fetch failed with errors\n"
    CommonSchemas_ValidationErrorExtension:
      required:
      - type
      - error_fields
      properties:
        type:
          type: string
          enum:
          - VALIDATION_ERROR
        error_fields:
          type: array
          items:
            type: object
            properties:
              field_name:
                type: string
                description: 'The field name that doesn''t pass the validation.

                  '
              reason:
                type: string
    CreateCatalogResponse:
      type: object
      required:
      - catalog_id
      - business_id
      - name
      - currency
      - review_status
      - total_item_count
      - ad_accounts
      - product_sources
      - created_at
      - updated_at
      properties:
        catalog_id:
          type: integer
          format: int64
