      - CUSTOM_LABEL_2
      - CUSTOM_LABEL_3
      - CUSTOM_LABEL_4
      - CUSTOM_NUMBER_0
      - CUSTOM_NUMBER_1
      - CUSTOM_NUMBER_2
      - CUSTOM_NUMBER_3
      - CUSTOM_NUMBER_4
      description: Supported fields for catalog product filtering.
