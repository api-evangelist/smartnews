components:
  schemas:
    ReviewStatus:
      type: string
      enum:
      - SUBMITTED
      - APPROVED
      - REJECTED
    UnauthorizedError:
      type: object
      allOf:
      - $ref: '#/components/schemas/UnauthorizedErrorExtension'
      - $ref: '#/components/schemas/ErrorBase'
    UnexpectedErrorExtension:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - UNEXPECTED_ERROR
    TrackingType:
      type: string
      enum:
      - ANDROID
      - IOS
      - ALL
      description: 'The platform type for app tracking.

        - ANDROID: Android platform only

        - IOS: iOS platform only

        - ALL: Both Android and iOS platforms

        '
    CommonSchemas_ValidationErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/CommonSchemas_ValidationError'
    Status:
      type: string
      enum:
      - CREATED
      - READY
      - ERROR
      description: 'Status of the product set generation.

        - CREATED: Product set is pending processing or regeneration.

        - READY: Latest processing succeeded and the set is ready for delivery.

        - ERROR: Latest processing failed or produced zero matching items.

        '
    ProductSource:
      type: object
      required:
      - product_source_id
      - catalog_id
      - product_source_name
      - file_type
      - file_url
      - status
      - last_fetched_at
      - last_failed_item_count
      - last_successful_item_count
      properties:
        product_source_id:
          type: integer
          format: int64
          description: Unique identifier of the product source.
        catalog_id:
          type: integer
          format: int64
          description: Identifier of the catalog this product source belongs to.
        product_source_name:
          type: string
          description: Name of the product source.
        file_type:
          $ref: '#/components/schemas/CommonSchemas_FileType'
        file_url:
          type: string
          description: FTP, HTTP, or HTTPS URL to the feed file.
        username:
          type:
          - string
          - 'null'
          description: 'Optional username for feed file access. The stored password is never

            returned.

            '
        status:
          $ref: '#/components/schemas/ProductSourceStatus'
        ingestion_error_reason:
          $ref: '#/components/schemas/IngestionErrorReason'
        ingestion_error_message:
          type:
          - string
          - 'null'
          description: 'Localized human-readable error message resolved from ingestion_error_reason.

            Language is determined by the Accept-Language header. Null when status is not ERROR.

            '
        last_fetched_at:
          type: string
          format: date-time
          description: Timestamp of the most recent ingestion attempt.
        last_failed_item_count:
          type: integer
          format: int64
          minimum: 0
          description: Number of items that failed in the latest ingestion.
        last_successful_item_count:
          type: integer
          format: int64
          minimum: 0
          description: 'Number of items successfully imported in the latest ingestion (deliverable: in stock and not blocked).'
        last_out_of_stock_item_count:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
          x-bypass-name-conversion: true
          description: Number of items excluded in the latest ingestion because they are out of stock. Retained in the catalog but not deliverable. NOT counted toward the WARNING threshold. Null until a successful ingestion has produced a breakdown.
        last_unparsable_item_count:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
          x-bypass-name-conversion: true
          description: Number of items in the latest ingestion that failed field validation (missing/invalid required fields). Null until a successful ingestion has produced a breakdown.
        last_blocked_item_count:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
          x-bypass-name-conversion: true
          description: Number of items blocked by content/moderation policy in the latest ingestion. Aggregate across all blocking reasons (specific reasons are not disclosed). Null until a successful ingestion has produced a breakdown.
      description: "Product source configuration and operational data. Returned identically by\nthe catalog endpoints (nested under `product_sources`) and by the product\nsource endpoints, so a client always sees the same complete representation\nof a product source regardless of which API surface it consumed.\nItem import breakdown (last_out_of_stock_item_count, last_unparsable_item_count,\nlast_blocked_item_count) from the latest successful ingestion's ParseSummary:\n  input    = parsable + last_unparsable_item_count\n  parsable = in_stock + last_out_of_stock_item_count\n  in_stock = last_successful_item_count (deliverable) + last_blocked_item_count\nThe breakdown counts are null until a successful ingestion has produced them.\n"
    BadRequestErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/BadRequestError'
    UnexpectedErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/UnexpectedError'
    CreateCatalogRequest:
      type: object
      required:
      - name
      - currency
      - da_ad_account_ids
      - pixel_tag_id
      - product_source
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: Human-readable display name for the catalog.
        currency:
          type: string
          enum:
          - JPY
          description: Currency for the catalog. Currently only JPY is supported.
        description:
          type: string
          maxLength: 1024
          description: Optional description of the catalog.
        da_ad_account_ids:
          type: array
          items:
            type: integer
            format: int64
          minItems: 1
          description: List of dynamic ad account IDs that can access this catalog. At least one is required.
        all_ad_account_access:
          type: boolean
          default: false
          description: If true, all DA ad accounts of the business have access to this catalog.
        pixel_tag_id:
          type: string
          maxLength: 64
          description: Pixel tag ID to associate with this catalog for web tracking.
        app_tracking:
          $ref: '#/components/schemas/AppTracking'
        product_source:
          $ref: '#/components/schemas/ProductSourceRequest'
      description: Request body for creating a new catalog.
    CatalogArrayResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CatalogResponse'
          description: Array of catalog objects returned by the list operation.
      description: Response wrapper containing a list of catalogs for a given business.
    FilterRuleRequest:
      type: object
      required:
      - field
      - condition
      - values
      properties:
        field:
          $ref: '#/components/schemas/FilterField'
        condition:
          $ref: '#/components/schemas/FilterCondition'
        values:
          type: array
          items:
            type: string
            maxLength: 255
          maxItems: 10
          description: 'Array of values used by the condition. Maximum 10 values allowed for IS_ANY_OF_THE_FOLLOWINGS and IS_NOT_ANY_OF_THE_FOLLOWINGS conditions. Other conditions take only one value.

            For numeric comparison conditions (GREATER_THAN, LESS_THAN, GREATER_THAN_OR_EQUAL, LESS_THAN_OR_EQUAL), values must be numeric strings. Non-numeric strings will result in an error.

            '
      description: Filter rule input for creating or updating a product set.
    ProductSet:
      type: object
      required:
      - product_set_id
      - catalog_id
      - name
      - status
      - rule_match_type
      - item_count
      - is_universal_set
      - created_at
      - updated_at
      properties:
        product_set_id:
          type: integer
          format: int64
          description: Unique identifier of the product set.
        catalog_id:
          type: integer
          format: int64
          description: Identifier of the catalog this product set belongs to.
        name:
          type: string
          maxLength: 255
          description: Human-readable display name for the product set.
        status:
          $ref: '#/components/schemas/Status'
        rule_match_type:
          $ref: '#/components/schemas/RuleMatchType'
        filter_rules:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/FilterRule'
          description: Collection of filter rules applied to build this product set. Empty array represents no filters applied.
        item_count:
          type: integer
          format: int64
          minimum: 0
          description: Number of catalog items that satisfied the filter rules in the latest run.
        last_processed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the latest product set generation completion.
        condition_updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The timestamp at which productSet’s condition (rule_match_type, filter_rules) are changed.
        is_universal_set:
          type: boolean
          description: Indicates whether this product set represents the default all-items set.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the product set was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the product set configuration was last updated.
      description: Product set definition along with the latest operational metadata.
