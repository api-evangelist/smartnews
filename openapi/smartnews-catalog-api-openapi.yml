      - tracking_type
      properties:
        tracking_type:
          $ref: '#/components/schemas/TrackingType'
        ios_app_id:
          type: string
          description: iOS App ID. Required if tracking_type is IOS or ALL.
        android_app_id:
          type: string
          description: Android App ID. Required if tracking_type is ANDROID or ALL.
      description: Mobile app tracking configuration for the catalog.
    ProductSource:
      type: object
      required:
      - product_source_id
      - catalog_id
      - product_source_name
      - file_type
      - file_url
      - status
      - last_fetched_at
      - last_failed_item_count
      - last_successful_item_count
      properties:
        product_source_id:
          type: integer
          format: int64
          description: Unique identifier of the product source.
        catalog_id:
          type: integer
          format: int64
          description: Identifier of the catalog this product source belongs to.
        product_source_name:
          type: string
          description: Name of the product source.
        file_type:
          $ref: '#/components/schemas/CommonSchemas_FileType'
        file_url:
          type: string
          description: FTP, HTTP, or HTTPS URL to the feed file.
        username:
          type: string
          nullable: true
          description: 'Optional username for feed file access. The stored password is never

            returned.

            '
        status:
          $ref: '#/components/schemas/ProductSourceStatus'
        ingestion_error_reason:
          $ref: '#/components/schemas/IngestionErrorReason'
        ingestion_error_message:
          type: string
          nullable: true
          description: 'Localized human-readable error message resolved from ingestion_error_reason.

            Language is determined by the Accept-Language header. Null when status is not ERROR.

            '
        last_fetched_at:
          type: string
          format: date-time
          description: Timestamp of the most recent ingestion attempt.
        last_failed_item_count:
          type: integer
          format: int64
          minimum: 0
          description: Number of items that failed in the latest ingestion.
        last_successful_item_count:
          type: integer
          format: int64
          minimum: 0
          description: 'Number of items successfully imported in the latest ingestion (deliverable: in stock and not blocked).'
        last_out_of_stock_item_count:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          x-bypass-name-conversion: true
          description: Number of items excluded in the latest ingestion because they are out of stock. Retained in the catalog but not deliverable. NOT counted toward the WARNING threshold. Null until a successful ingestion has produced a breakdown.
        last_unparsable_item_count:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          x-bypass-name-conversion: true
          description: Number of items in the latest ingestion that failed field validation (missing/invalid required fields). Null until a successful ingestion has produced a breakdown.
        last_blocked_item_count:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          x-bypass-name-conversion: true
          description: Number of items blocked by content/moderation policy in the latest ingestion. Aggregate across all blocking reasons (specific reasons are not disclosed). Null until a successful ingestion has produced a breakdown.
      description: "Product source configuration and operational data. Returned identically by\nthe catalog endpoints (nested under `product_sources`) and by the product\nsource endpoints, so a client always sees the same complete representation\nof a product source regardless of which API surface it consumed.\nItem import breakdown (last_out_of_stock_item_count, last_unparsable_item_count,\nlast_blocked_item_count) from the latest successful ingestion's ParseSummary:\n  input    = parsable + last_unparsable_item_count\n  parsable = in_stock + last_out_of_stock_item_count\n  in_stock = last_successful_item_count (deliverable) + last_blocked_item_count\nThe breakdown counts are null until a successful ingestion has produced them.\n"
