        android_app_id:
          type: string
          description: Android App ID. Required if tracking_type is ANDROID or ALL.
      description: Mobile app tracking configuration for the catalog.
    IngestionErrorReason:
      type:
      - string
      - 'null'
      enum:
      - AUTH_FAILED
      - FILE_NOT_FOUND
      - TIMEOUT
      - INVALID_FORMAT
      - REQUEST_ERROR
      - SERVER_UNAVAILABLE
      - UNKNOWN_ERROR
      description: 'The reason for an ingestion error. Null when product source status is not ERROR.

        - AUTH_FAILED: Authentication failed (HTTP 401/403, FTP 530)

        - FILE_NOT_FOUND: File does not exist at the specified path (HTTP 404, FTP 550)

        - TIMEOUT: Server unreachable or timed out (HTTP 504, DNS failure)

        - INVALID_FORMAT: File is empty, starts with blank lines, or header cannot be parsed

        - REQUEST_ERROR: Bad URL, SSL issues, or too many redirects (HTTP 400)

        - SERVER_UNAVAILABLE: Server error or temporarily unavailable (HTTP 500/502/503/429, FTP 421-452/552, connection reset)

        - UNKNOWN_ERROR: Unclassifiable error (FTP 500-503/551, other)

        '
    CommonSchemas_ResourceNotFoundErrorExtension:
      type: object
      required:
      - type
      - resource_type
      properties:
        type:
          type: string
          enum:
          - NOT_FOUND
          - DELETED
