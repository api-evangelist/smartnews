        currency:
          type: string
          description: Currency for the catalog.
        description:
          type: string
          description: Optional description of the catalog.
        review_status:
          $ref: '#/components/schemas/ReviewStatus'
        total_item_count:
          type: integer
          format: int32
          minimum: 0
          description: Total number of product items currently available in the catalog across all product sources.
        all_ad_account_access:
