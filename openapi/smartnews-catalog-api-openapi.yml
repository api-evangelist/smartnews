      - name: business_id
        in: path
        required: true
        description: Identifier of the business that owns the catalog.
        schema:
          type: integer
          format: int64
      - name: catalog_id
        in: path
        required: true
        description: Identifier of the catalog to retrieve.
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Catalog details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogResponse'
        '401':
          description: Unauthorized. The access token is either expired or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponse'
        '403':
          description: Forbidden. Access to the requested resource is denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponse'
              examples:
                access_denied:
                  summary: Missing `ViewCatalog` permission.
                  value:
                    error:
                      type: ACCESS_DENIED
                      message: ViewCatalog permission is required.
                      retriable: false
        '404':
          description: When the business or catalog resource specified in the path is not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonSchemas_ResourceNotFoundErrorResponse'
        '500':
          description: Unexpected error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnexpectedErrorResponse'
        '503':
          description: The service is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableErrorResponse'
    patch:
      tags:
      - catalog
      description: 'Update metadata of an existing catalog under the specified business.

        Only the catalog-level fields are editable here; product source fields are

        managed via the product source endpoint and no connection validation is

        triggered by this operation.

        '
      operationId: updateBusinessCatalog
      parameters:
      - name: business_id
        in: path
        required: true
        description: Identifier of the business that owns the catalog.
        schema:
          type: integer
          format: int64
      - name: catalog_id
        in: path
        required: true
        description: Identifier of the catalog to update.
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCatalogRequest'
      responses:
        '200':
          description: Catalog updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogResponse'
        '400':
          description: Bad Request. The request body or query parameters are invalid.
          content:
            application/json:
              schema:
