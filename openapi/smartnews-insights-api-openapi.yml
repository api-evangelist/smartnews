        name:
          type: string
          description: The name of the object.
        objective:
          $ref: '#/components/schemas/CampaignObjective'
        optimization_event:
          $ref: '#/components/schemas/OptimizationEvent'
        ready_for_delivery:
          $ref: '#/components/schemas/ReadyForDelivery'
        store_set_id:
          $ref: '#/components/schemas/StoreSetId'
        parent:
          type: object
          description: 'The parent of the parent. The properties are the same as parent (`id`, `name`, `type`, `objective`,

            `optimization_event` ,`ready_for_delivery` ,`store_set_id` ,`parent`)

            '
    OptimizationGoal:
      type: string
      enum:
      - CLICKS
      - OFFSITE_CONVERSIONS
      - VIEWABLE_IMPRESSIONS
      - INSTALL
      - INSTALL_WITH_IN_APP_EVENT
      - ROAS
      nullable: true
      description: 'Optimization goal defines how the campaign is optimized.


        This is required and configurable unless bidding strategy is `MANUAL`.


        | Objective     | Bid Strategy   | Available Optimization Goal         |

        |---------------|----------------|-------------------------------------|

        | TRAFFIC       | HIGHEST_VOLUME | CLICKS                              |

        | TRAFFIC       | MANUAL         | null                                |

        | SALES         | HIGHEST_VOLUME | OFFSITE_CONVERSIONS, ROAS           |

        | SALES         | TARGET_COST    | OFFSITE_CONVERSIONS                 |

        | AWARENESS     | HIGHEST_VOLUME | VIEWABLE_IMPRESSIONS                |

        | AWARENESS     | MANUAL         | null                                |

        | APP_PROMOTION | HIGHEST_VOLUME | INSTALL, INSTALL_WITH_IN_APP_EVENT  |

        | APP_PROMOTION | TARGET_COST    | INSTALL, INSTALL_WITH_IN_APP_EVENT  |


        This field is not updatable when `ready_for_delivery` is `true`.

        ROAS is only allowed to Dynamic Ads campaign with SALES Objective.

        '
    UnauthorizedError:
      type: object
      allOf:
      - $ref: '#/components/schemas/UnauthorizedErrorExtension'
      - $ref: '#/components/schemas/ErrorBase'
    ForbiddenErrorResponse:
      type: object
      required:
      - error
