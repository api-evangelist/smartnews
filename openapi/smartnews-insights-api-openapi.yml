    MetricsBreakdownV3:
      allOf:
      - type: object
        properties:
          segment_name:
            type: string
            example: 21-24 & MALE
            description: "A breakdown type can encompass numerous segment labels. For instance, the age breakdown type might include\nsegment names such as \"under 20\" and \"21-24\", etc. with each being a string that gets translated according\nto the `Accept-Language`` header in the request.\n\nAPI will return metrics of certain segments based on the ad objects settings.\n  1. API will return metrics of only targeted segment names that were selected during creation of ad object\n  2. If no targeted segments were selected then API will return metrics of all segment names of that breakdown type.\n\nSince audience targeting is supported at ad_group layer, the set of segment names for each layer will be as follows.\n1. For a campaign (C) with ad_groups AG1 and AG2 with following targeted audiences\n    AG1: (gender: female, age: under 20)\n    AG2: (gender: female, age: 21-24)\n  and\n    when breakdown_type = gender\n      then set of segment names will be (female)\n    when breakdown_type = age\n      then set of th segment names will be (under 20, 21-24)\n    when breakdown_type = age_and_gender\n      then set of segment names will be (female & under 20, female & 21-24)\n  Basically, we do union of segment names of ad_group.\n2. For a ad_group, the segement names will be same as that of ad_group\n3. For a ad, the segement names will be same as its parent ad_group.\n"
          period:
            type: string
            example: 2023-11-28, 2023-11-28 12:00
            description: 'It is a string to represent daily or hourly metrics for a requested time range.

              Time is already in Advertiser''s timezone.

              '
      - $ref: '#/components/schemas/MetricsV3'
    Format:
      type: string
      enum:
