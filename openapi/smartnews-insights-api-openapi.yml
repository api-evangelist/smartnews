          description: The name of the object.
        created_at:
          type: string
          format: date-time
          description: The date-time at which the object was created.
        updated_at:
          type: string
          format: date-time
          description: The date-time at which the object was updated.
        configured_status:
          $ref: '#/components/schemas/ConfiguredStatus'
        delivery_status:
