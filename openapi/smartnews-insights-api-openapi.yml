      - type
      properties:
        type:
          type: string
          enum:
          - TERMS_OF_SERVICE_NOT_ACCEPTED
          - ACCESS_DENIED
        terms_of_service_path:
          type: string
          example: /terms/agreement
          description: The path that the user must open in a browser to accept the terms of service. The hostname matches the API hostname.
    DeliveryStatusObject:
      type: object
      required:
      - status
      - reason
      - description
      properties:
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        reason:
          $ref: '#/components/schemas/DeliveryStatusReason'
        description:
          type: string
          description: A localized human readable description of the reason. The language is controlled by the Accept-Language header in the request.
      description: An Object that provides information about the delivery status of the campaign.
    IsLargeUnitAds:
      type: boolean
      description: 'A boolean flag that indicates whether ads from this campaign are displayed in the app using the large unit format.


        This feature is only available when objective is `AWARENESS`.


        For eligible ad accounts, this feature is also available when objective is `TRAFFIC` or `SALES`.


        This field''s value cannot be changed if the campaign already has 1 or more ads.


        Note: This field is not settable for US region ad accounts.

        '
    RateLimitedError:
      type: object
      allOf:
      - $ref: '#/components/schemas/ErrorBase'
      - type: object
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - TOO_MANY_REQUESTS
    CommonMetadata:
      type: object
      properties:
