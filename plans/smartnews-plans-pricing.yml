note: >-
  SmartNews publishes no plans, tiers or price list for the SmartNews Ads
  Marketing API. The API itself is not sold as a product — it is a free control
  plane over a SmartNews Ads account, and access is granted per organization only
  after a reviewed Developer Application Form. Spend is auction-based advertising
  media cost (daily/lifetime campaign budgets set by the advertiser, with Max
  Conversion and Max Click bid strategies), not an API subscription, so there is
  no per-call price, no included quota and no overage schedule to record.
